version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*", "react-router"]
      graphql:
        patterns: ["graphql", "graphql-ws", "urql", "@urql/*", "@graphql-codegen/*", "@graphql-tools/*"]
      tooling:
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*", "typescript", "oxlint", "tailwindcss", "@tailwindcss/*", "@playwright/test", "@testing-library/*", "jsdom"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
